spring:
  application:
    name: agent-kb-qa
  profiles:
    active: dev
  web:
    locale: zh_CN
    locale-resolver: fixed
  autoconfigure:
    exclude:
      - dev.langchain4j.spring.LangChain4jAutoConfig

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
